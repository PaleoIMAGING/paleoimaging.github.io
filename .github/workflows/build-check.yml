name: Build check

# Builds the site with the same gem set GitHub Pages uses and checks the result.
# It never deploys: read-only permissions, no Pages or deployment steps.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jekyll:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: tools

      # The empty-state checks must not depend on what is currently published, so they run
      # against a temporary copy with every meeting record removed and the feed regenerated
      # from zero records. The real repository data is checked separately below.
      - name: Build a copy with no meeting records (empty-state fixture)
        run: |
          mkdir "$RUNNER_TEMP/without-records"
          rsync -a --exclude .git --exclude _site --exclude node_modules ./ "$RUNNER_TEMP/without-records/"
          rm -f "$RUNNER_TEMP"/without-records/_data/meetings/*.yml "$RUNNER_TEMP"/without-records/_data/meetings/*.yaml
          node tools/build-ics.mjs --dir "$RUNNER_TEMP/without-records/_data/meetings" --out "$RUNNER_TEMP/without-records/meetings/feed.ics"
          bundle exec jekyll build --source "$RUNNER_TEMP/without-records" --destination "$RUNNER_TEMP/site-empty"

      - name: Check the empty-state fixture build (empty state, homepage unchanged, valid feed)
        run: node tools/site-test.mjs "$RUNNER_TEMP/site-empty" --empty

      - name: Build a copy containing the sample fixtures
        run: |
          mkdir "$RUNNER_TEMP/with-samples"
          rsync -a --exclude .git --exclude _site --exclude node_modules ./ "$RUNNER_TEMP/with-samples/"
          cp tools/test/fixtures/meetings/*.yml "$RUNNER_TEMP/with-samples/_data/meetings/"
          node tools/build-ics.mjs --dir "$RUNNER_TEMP/with-samples/_data/meetings" --out "$RUNNER_TEMP/with-samples/meetings/feed.ics"
          bundle exec jekyll build --source "$RUNNER_TEMP/with-samples" --destination "$RUNNER_TEMP/site-samples"

      - name: Check the sample build (filters, series, archive, safety)
        run: node tools/site-test.mjs "$RUNNER_TEMP/site-samples" --samples

      - name: Build a copy containing a deliberately hostile (invalid) record
        run: |
          mkdir "$RUNNER_TEMP/with-hostile"
          rsync -a --exclude .git --exclude _site --exclude node_modules ./ "$RUNNER_TEMP/with-hostile/"
          cp tools/test/fixtures/hostile/hostile-record.yml "$RUNNER_TEMP/with-hostile/_data/meetings/"
          bundle exec jekyll build --source "$RUNNER_TEMP/with-hostile" --destination "$RUNNER_TEMP/site-hostile"

      - name: Check that hostile data is neutralised by the page itself
        run: node tools/site-test.mjs "$RUNNER_TEMP/site-hostile" --hostile

      - name: Check the submission form (conditional fields, validation, accessibility, privacy, disabled submit)
        run: node tools/form-test.mjs "$RUNNER_TEMP/site-empty"

      - name: Build the real repository data (published records and committed feed)
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/site-published"

      - name: Check that every published record is in the page data and in the committed feed
        run: node tools/site-test.mjs "$RUNNER_TEMP/site-published" --published
