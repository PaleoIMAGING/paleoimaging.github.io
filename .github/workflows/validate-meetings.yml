name: Validate meetings

# Runs on every pull request (no path filter) so that it can be a required status check
# in the "Protect main" ruleset: a required check that never starts would block the merge.
#
# meetings/feed.ics is a generated deployment artifact. A pull request needs to carry only its
# YAML record: the check generates a fresh calendar from the proposed records (never from the
# committed feed) and a guard refuses any pull request that tracks the feed in Git.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - name: Unit tests (validator, recurrence, iCalendar, shared modules)
        run: npm test
        working-directory: tools
      - name: Validate published records
        run: npm run validate
        working-directory: tools
      - name: Generate and verify a fresh calendar from the proposed records
        run: npm run check:calendar
        working-directory: tools
      # meetings/feed.ics is generated at publication. Tracking it again would bring back merge
      # conflicts between concurrent submissions, so it is refused outright.
      - name: Generated-artifact guard (meetings/feed.ics must not be tracked)
        run: |
          if [ -n "$(git ls-files meetings/feed.ics)" ]; then
            echo "::error file=meetings/feed.ics::meetings/feed.ics is a generated deployment artifact and must not be committed. Remove it from Git (git rm --cached meetings/feed.ics); the Pages workflow generates it."
            exit 1
          fi
      - name: Shared-file manifest is up to date
        run: npm run shared:check
        working-directory: tools
