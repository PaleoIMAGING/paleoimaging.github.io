<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/PaleoIMAGING_logo.png' | relative_url }}" alt="PaleoIMAGING">
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/core-group/' | relative_url }}"{% if page.url contains '/core-group/' %} aria-current="page"{% endif %}>Core Group</a></li>
        <li class="has-sub">
          <a href="{{ '/working-groups/' | relative_url }}"{% if page.url contains '/working-groups/' %} aria-current="page"{% endif %}>Working Groups</a>
          <ul class="sub">
            {%- for wg in site.data.working_groups %}
            <li><a href="{{ '/working-groups/' | append: wg.slug | append: '/' | relative_url }}">{{ wg.code }} &mdash; {{ wg.title }}</a></li>
            {%- endfor %}
          </ul>
        </li>
        <li><a href="{{ '/meetings/' | relative_url }}"{% if page.url contains '/meetings/' %} aria-current="page"{% endif %}>Meetings</a></li>
        <li><a href="{{ '/where-we-are/' | relative_url }}"{% if page.url contains '/where-we-are/' %} aria-current="page"{% endif %}>Where We Are</a></li>
        <li><a href="{{ '/news/' | relative_url }}"{% if page.url contains '/news/' %} aria-current="page"{% endif %}>News</a></li>
      </ul>
    </nav>
    <div class="header-tools">
      <a class="icon-link" href="https://github.com/PaleoIMAGING" aria-label="PaleoIMAGING on GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <a class="icon-link" href="{{ '/search/' | relative_url }}" aria-label="Search the site">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
      <a class="btn" href="https://listserv.unibe.ch/mailman/listinfo/paleoimaging.pages" rel="noopener">Join Us</a>
    </div>
  </div>
</header>
